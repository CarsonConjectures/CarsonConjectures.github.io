:root{font-family:"CAR VGA",Consolas,"Liberation Mono",monospace;font-size:16px;font-synthesis:none;color:#ffffff;background:#0000aa;color-scheme:dark;--cyan:#55ffff;--green:#55ff55;--gold:#ffff55}
*{box-sizing:border-box}
body{margin:0;padding:8px;background:#0000aa;line-height:1.25}
button,input{font:inherit;border-radius:0}
button{cursor:pointer;border:0;padding:6px 12px;background:#00aaaa;color:#000000;min-height:32px;white-space:nowrap}
button:hover,button:focus-visible{background:#0000aa;color:#ffffff}
button:active{background:#000000;color:#ffff55}
button.danger{background:#aaaaaa;text-decoration:underline;text-underline-offset:3px}
button.danger:hover,button.danger:focus-visible{background:#aa0000;color:#ffffff}
button:focus-visible,input:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:2px solid #ffff55;outline-offset:2px}
button.danger:focus-visible{outline-color:#000000}
button[hidden],[hidden]{display:none!important}
::selection{background:#aaaaaa;color:#000000}
h1,h2,b,strong,th{font-weight:400}
.terminal{max-width:1760px;margin:0 auto;border:3px double #55ffff}
.masthead{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:4px 12px;background:#aaaaaa;color:#000000;border-bottom:2px solid #0000aa;min-height:32px}
.masthead h1{font:inherit;margin:0;white-space:nowrap}
.counts{display:flex;gap:16px;flex-wrap:wrap}
.counter{white-space:nowrap}
.counter strong{color:#0000aa}
.configuration{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px 24px;padding:8px 12px;background:#aaaaaa;color:#000000}
.event-controls,.actions{display:flex;align-items:center;flex-wrap:wrap;gap:8px 16px}
.event-control{display:flex;align-items:center;gap:8px}
.event-control input{width:120px;min-width:0;padding:6px 8px;border:0;background:#0000aa;color:#ffffff;caret-color:#ffffff}
.actions{gap:8px}
.switch-label{display:flex;align-items:center;gap:8px;cursor:pointer;margin-right:12px;min-height:32px;white-space:nowrap}
.switch-label input{appearance:none;position:relative;flex:none;width:20px;height:20px;border:2px solid #000000;background:#aaaaaa;color:#000000;margin:0;cursor:pointer}
.switch-label input:checked:after{content:"X";position:absolute;inset:0;text-align:center;line-height:16px}
.table-scroll{overflow:auto;scrollbar-color:#aaaaaa #0000aa;border-top:3px double #55ffff}
table{border-collapse:separate;border-spacing:0;table-layout:fixed;width:100%;min-width:1260px;background:#0000aa}
caption,.sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
col.row-label{width:10%}col.joint-col{width:18%}col.total-col{width:19%}col.cond-col{width:17.5%}
th,td{border-right:1px solid #00aaaa;border-bottom:1px solid #00aaaa;padding:0;position:relative;vertical-align:middle}
tr>:last-child{border-right:0}tbody tr:last-child>*{border-bottom:0}
thead th{height:64px;padding:8px;color:#ffff55}
tbody th{padding:12px 8px;color:#ffff55;overflow-wrap:anywhere}
th small{display:block;font-size:16px;color:#55ffff;margin-bottom:4px}
th .head-event{display:block}
.total-boundary{border-left:2px solid #55ffff}
.total-row>*,.below-total>*{border-top:2px solid #55ffff}
.prob-cell{background:#0000aa;--group:#55ffff;--ink:#000000}
.cell-frame{position:absolute;pointer-events:none;border-style:solid;border-color:var(--group);background:var(--group);z-index:1}
.cell-content{position:relative;z-index:2;padding:16px 12px;min-height:180px;display:flex;flex-direction:column;justify-content:center;align-items:center}
.marginal .cell-content,.conditional .cell-content{min-height:144px}
.metric-label{height:16px;margin-bottom:4px;color:var(--ink)}
.prob-name{color:var(--ink);line-height:20px;margin-bottom:8px;text-align:center;max-width:100%;overflow-wrap:anywhere}
.value-line{display:flex;align-items:center;gap:8px;max-width:100%;margin-bottom:8px}
.prob-input{width:112px;min-width:48px;max-width:100%;height:28px;padding:4px 6px;text-align:center;border:1px solid #aaaaaa;background:#000000;color:#ffff55;caret-color:#ffffff;line-height:18px}
.prob-input::placeholder{color:#aaaaaa;opacity:1}
.prob-input[data-source=solved]{color:#55ffff;border-color:#55ffff}
.prob-input[data-source=given]{color:#ffff55;border-color:#ffff55}
.prob-input[aria-invalid=true]{background:#aa0000;color:#ffffff;border-color:#ff5555}
.prob-input:focus-visible{outline-color:var(--ink)}
.cell-source{font-size:16px;color:var(--ink);min-width:48px;max-width:56px;line-height:16px}
.cell-source.error{color:#ffffff;background:#aa0000}
.fixed-total{width:112px;line-height:18px;text-align:center;padding:4px 6px;border:1px solid #ffff55;color:#ffff55;background:#000000}
.formula-list{align-self:stretch;display:grid;gap:0;font-size:16px;line-height:20px;text-align:center;color:var(--ink);overflow-wrap:anywhere}
.formula-list>div{min-height:20px}
.event-symbol{white-space:normal;overflow-wrap:anywhere}
.event-symbol sup{font-size:12px;vertical-align:super;line-height:0;margin-left:1px}
/* The circle is the detector's mathematical symbol, with gaps around the plus. */
.detector-icon{display:inline-block;width:13px;height:13px;border:1px solid currentColor;border-radius:50%;position:relative;vertical-align:-1px;margin:0 1px}
.detector-icon:before,.detector-icon:after{content:"";position:absolute;background:currentColor;left:50%;top:50%;transform:translate(-50%,-50%)}
.detector-icon:before{width:5px;height:1px}.detector-icon:after{height:5px;width:1px}
.diagnostics{vertical-align:top;background:#0000aa}
.diagnostic-inner{position:relative;min-height:420px;padding:16px}
.unused-lines{color:#5555ff;line-height:32px;white-space:pre;user-select:none}
.assumption{position:absolute;top:24px;left:40px;right:24px;border:3px double #55ffff;padding:16px;background:#0000aa;color:#ffff55;line-height:24px;overflow-wrap:anywhere}
.assumption-formula{display:block;color:#ffffff;margin:8px 0 16px}
.assumption button{background:#aaaaaa;color:#000000}
.assumption button:hover{background:#00aaaa}
.void{background:#0000aa;color:#5555ff;text-align:center}
.legends{padding:12px 16px;border-top:3px double #55ffff}
.legend-title{font-size:16px;color:#ffff55;margin:0 0 8px}
.legend-groups{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px 16px;color:#aaaaaa}
.legend-group{display:flex;align-items:center;gap:8px;min-width:0;overflow-wrap:anywhere}
.swatch{width:12px;height:12px;background:var(--group);flex:none}
.lights{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));border-top:3px double #55ffff}
.light{padding:12px 8px;text-align:center;position:relative;border-right:1px solid #00aaaa}
.light:last-child{border-right:0}
.bulb{width:12px;height:12px;border:1px solid #aaaaaa;background:#0000aa;margin:0 auto 8px}
.light-label{color:#aaaaaa;line-height:20px;overflow-wrap:anywhere}
.light-state{display:block;color:#aaaaaa;line-height:20px;margin-top:4px}
.light[data-state=yes] .bulb{background:var(--signal);border-color:var(--signal)}
.light[data-state=yes] .light-label{color:#ffffff}
.light[data-state=yes] .light-state{color:var(--signal)}
.statusbar{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:32px;padding:4px 12px;background:#aaaaaa;color:#000000}
.notice{margin:0;line-height:24px;overflow-wrap:anywhere}
.notice.error{background:#aa0000;color:#ffffff;padding:0 8px}
.scroll-hint{display:none;white-space:nowrap}
@media(max-width:1300px){.scroll-hint{display:inline}.lights{grid-template-columns:repeat(3,minmax(0,1fr))}.light:nth-child(3){border-right:0}.light:nth-child(-n+3){border-bottom:1px solid #00aaaa}}
@media(max-width:760px){body{padding:0}.terminal{border-width:2px}.masthead{align-items:flex-start;flex-direction:column;gap:4px;padding:8px}.counts{gap:16px}.configuration{padding:8px;gap:8px}.event-controls{gap:8px 16px}.event-control{gap:8px}.event-control input{width:96px}.event-control{flex-direction:column;align-items:flex-start}.actions{width:100%;gap:8px}.switch-label{width:100%;margin:0}button{padding:6px 8px}.legend-groups{grid-template-columns:repeat(2,minmax(0,1fr))}.legends{padding:12px 8px}.lights{grid-template-columns:repeat(2,minmax(0,1fr))}.light:nth-child(3){border-right:1px solid #00aaaa}.light:nth-child(2n){border-right:0}.light:nth-child(-n+4){border-bottom:1px solid #00aaaa}.statusbar{align-items:flex-start;padding:4px 8px;gap:8px}}
@media print{body{padding:0}.configuration{display:none}.terminal{max-width:none}.table-scroll{overflow:visible}table{min-width:0}.scroll-hint{display:none}}
</style>
</head>

<script id="car-solver">
'use strict';
const CarSolver = (() => {
  const EPS = 1e-12;
  const close = (a,b) => Math.abs(a-b) <= EPS + 1e-10*Math.max(Math.abs(a),Math.abs(b));
  const clean = x => Math.abs(x)<1e-13 ? 0 : Math.abs(1-x)<1e-13 ? 1 : x;
  const dot = (a,b) => a.reduce((sum,x,i)=>sum+x*b[i],0);
  const A=[1,0,1,0], Ac=[0,1,0,1], B=[1,1,0,0], Bc=[0,0,1,1];
  const unit = i => Array.from({length:4},(_,j)=>+(i===j));
  const fields = [
    {id:'jAB',kind:'joint',n:unit(0),a:false,b:false},
    {id:'jAcB',kind:'joint',n:unit(1),a:true,b:false},
    {id:'jABc',kind:'joint',n:unit(2),a:false,b:true},
    {id:'jAcBc',kind:'joint',n:unit(3),a:true,b:true},
    {id:'mA',kind:'marginal',n:A,event:'a'},
    {id:'mAc',kind:'marginal',n:Ac,event:'ac'},
    {id:'mB',kind:'marginal',n:B,event:'b'},
    {id:'mBc',kind:'marginal',n:Bc,event:'bc'},
    {id:'cAgB',kind:'conditional',n:unit(0),d:B,event:'a',condition:'b',metric:'PRECISION'},
    {id:'cAcgB',kind:'conditional',n:unit(1),d:B,event:'ac',condition:'b'},
    {id:'cAgBc',kind:'conditional',n:unit(2),d:Bc,event:'a',condition:'bc'},
    {id:'cAcgBc',kind:'conditional',n:unit(3),d:Bc,event:'ac',condition:'bc'},
    {id:'cBgA',kind:'conditional',n:unit(0),d:A,event:'b',condition:'a',metric:'RECALL'},
    {id:'cBcgA',kind:'conditional',n:unit(2),d:A,event:'bc',condition:'a'},
    {id:'cBgAc',kind:'conditional',n:unit(1),d:Ac,event:'b',condition:'ac'},
    {id:'cBcgAc',kind:'conditional',n:unit(3),d:Ac,event:'bc',condition:'ac'}
  ];
  const byId = Object.fromEntries(fields.map(f=>[f.id,f]));
  function parseInput(raw) {
    const s=raw.trim();
    if(!s) return {empty:true};
    const number='[+-]?(?:\\d+(?:\\.\\d*)?|\\.\\d+)(?:[eE][+-]?\\d+)?';
    let value;
    if(new RegExp('^'+number+'\\s*%$').test(s)) value=Number(s.slice(0,-1).trim())/100;
    else if(new RegExp('^'+number+'\\s*/\\s*'+number+'$').test(s)) {
      const parts=s.split('/').map(Number);
      if(parts[1]===0) return {error:'A fraction cannot have a zero denominator.'};
      value=parts[0]/parts[1];
    } else if(new RegExp('^'+number+'$').test(s)) value=Number(s);
    else return {error:'Use a decimal, a fraction, or a percentage.'};
    if(!Number.isFinite(value)||value<0||value>1) return {error:'Probabilities must be between 0 and 1 (0% to 100%).'};
    return {value};
  }
  function equations(entries) {
    const rows=[[1,1,1,1,1]], strict=[];
    for(const [id,p] of Object.entries(entries)) {
      const f=byId[id];
      if(!f || !Number.isFinite(p)||p<0||p>1) return {error:'invalid'};
      rows.push(f.d ? [...f.n.map((n,i)=>n-p*f.d[i]),0] : [...f.n,p]);
      if(f.d) strict.push(f.d);
    }
    return {rows,strict};
  }
  function rref(rows) {
    const m=rows.map(row=>row.slice()), pivots=[];
    let r=0;
    for(let c=0;c<4 && r<m.length;c++) {
      let best=r;
      for(let i=r+1;i<m.length;i++) if(Math.abs(m[i][c])>Math.abs(m[best][c])) best=i;
      if(Math.abs(m[best][c])<=EPS) continue;
      [m[r],m[best]]=[m[best],m[r]];
      const p=m[r][c];
      for(let j=0;j<5;j++) m[r][j]/=p;
      for(let i=0;i<m.length;i++) if(i!==r) {
        const k=m[i][c];
        for(let j=0;j<5;j++) m[i][j]-=k*m[r][j];
      }
      pivots.push(c);r++;
    }
    if(m.some(row=>row.slice(0,4).every(x=>Math.abs(x)<=EPS)&&Math.abs(row[4])>1e-10)) return null;
    return {m,pivots};
  }
  function unique(points) {
    const result=[];
    for(const p of points) if(!result.some(q=>p.every((v,i)=>close(v,q[i])))) result.push(p);
    return result;
  }
  function linearModel(entries) {
    const eq=equations(entries);
    if(eq.error) return {error:'invalid'};
    if(!rref(eq.rows)) return {error:'conflict'};
    const vertices=[];
    // A bounded four-variable simplex section has vertices at active zero bounds.
    for(let mask=0;mask<16;mask++) {
      const rows=eq.rows.slice();
      for(let i=0;i<4;i++) if(mask&(1<<i)) rows.push([...unit(i),0]);
      const reduced=rref(rows);
      if(!reduced||reduced.pivots.length!==4) continue;
      const q=[0,0,0,0];
      reduced.pivots.forEach((c,i)=>q[c]=reduced.m[i][4]);
      if(q.some(x=>x < -EPS || x > 1+EPS)) continue;
      if(!eq.rows.every(row=>close(dot(row.slice(0,4),q),row[4]))) continue;
      vertices.push(q.map(clean));
    }
    const points=unique(vertices);
    if(!points.length) return {error:'conflict'};
    // Positive denominators can hold simultaneously at the mean of the vertices.
    if(eq.strict.some(d=>!points.some(p=>dot(d,p)>EPS))) return {error:'zero-condition'};
    return {points,strict:eq.strict,independent:false};
  }
  function independentModel(entries) {
    const eq=equations(entries);
    if(eq.error) return {error:'invalid'};
    let a=null,b=null,bad=false;
    const set=(axis,value)=>{
      if(value < -EPS || value > 1+EPS) {bad=true;return;}
      value=clean(value);
      if(axis==='a') {if(a!==null&&!close(a,value)) bad=true; else a=value;}
      else {if(b!==null&&!close(b,value)) bad=true; else b=value;}
    };
    const given=[null,null,null,null];
    for(const [id,p] of Object.entries(entries)) {
      const f=byId[id];
      if(f.kind==='joint') given[f.n.indexOf(1)]=p;
      else set(f.event[0], f.event.length===2 ? 1-p : p);
    }
    const has=i=>given[i]!==null;
    if(has(0)&&has(2)) set('a',given[0]+given[2]);
    if(has(1)&&has(3)) set('a',1-given[1]-given[3]);
    if(has(0)&&has(1)) set('b',given[0]+given[1]);
    if(has(2)&&has(3)) set('b',1-given[2]-given[3]);
    const pairs=[];
    if(!bad && (a!==null||b!==null)) {
      if(a!==null) {
        const coeff=[a,1-a,-a,-(1-a)], constant=[0,0,a,1-a];
        for(let i=0;i<4;i++) if(has(i)) {
          if(Math.abs(coeff[i])>EPS) set('b',(given[i]-constant[i])/coeff[i]);
          else if(!close(given[i],constant[i])) bad=true;
        }
        if(!bad) for(const y of b===null?[0,.25,.5,.75,1]:[b]) pairs.push([a,y]);
      } else {
        const coeff=[b,-b,1-b,-(1-b)], constant=[0,b,0,1-b];
        for(let i=0;i<4;i++) if(has(i)) {
          if(Math.abs(coeff[i])>EPS) set('a',(given[i]-constant[i])/coeff[i]);
          else if(!close(given[i],constant[i])) bad=true;
        }
        if(!bad) for(const x of a===null?[0,.25,.5,.75,1]:[a]) pairs.push([x,b]);
      }
    } else if(!bad) {
      const indices=[0,1,2,3].filter(has);
      if(indices.length===2) {
        if(has(0)&&has(3)) {
          const sum=1+given[0]-given[3], disc=sum*sum-4*given[0];
          if(disc>=-EPS) for(const sign of [-1,1]) {const x=(sum+sign*Math.sqrt(Math.max(0,disc)))/2;pairs.push([x,sum-x]);}
        } else if(has(1)&&has(2)) {
          const diff=given[2]-given[1], disc=(1-diff)**2-4*given[1];
          if(disc>=-EPS) for(const sign of [-1,1]) {const y=(1-diff+sign*Math.sqrt(Math.max(0,disc)))/2;pairs.push([y+diff,y]);}
        }
      } else if(indices.length===1) {
        const i=indices[0],p=given[i], push=(u,v)=>pairs.push([i%2?1-u:u,i>=2?1-v:v]);
        if(p===0) {for(const t of [0,.25,.5,.75,1]) {push(0,t);push(t,0);}}
        else {
          // Endpoints and interior witnesses of u*v=p, including its symmetric extremum.
          for(const u of [p,p+(1-p)*.25,Math.sqrt(p),p+(1-p)*.5,p+(1-p)*.75,1]) push(u,p/u);
        }
      } else if(indices.length===0) for(const x of [0,.5,1]) for(const y of [0,.5,1]) pairs.push([x,y]);
    }
    const points=unique(pairs.filter(([x,y])=>x>=-EPS&&x<=1+EPS&&y>=-EPS&&y<=1+EPS)
      .map(([x,y])=>[x*y,(1-x)*y,x*(1-y),(1-x)*(1-y)].map(clean))
      .filter(q=>eq.rows.every(row=>close(dot(row.slice(0,4),q),row[4]))&&eq.strict.every(d=>dot(d,q)>EPS)));
    return points.length?{points,strict:eq.strict,independent:true}:{error:'independence'};
  }
  function identify(model,f) {
    const points=model.points;
    let values,mayBeUndefined=false;
    if(f.d) {
      const defined=points.filter(p=>dot(f.d,p)>EPS);
      if(!defined.length) return {status:'undefined',value:null};
      values=defined.map(p=>dot(f.n,p)/dot(f.d,p));
      const zeroFace=points.filter(p=>dot(f.d,p)<=EPS);
      mayBeUndefined=zeroFace.length>0 && (model.independent || model.strict.every(d=>zeroFace.some(p=>dot(d,p)>EPS)));
    } else values=points.map(p=>dot(f.n,p));
    const first=values[0];
    return values.every(v=>close(v,first)) ? {status:'known',value:clean(first),mayBeUndefined} : {status:'unknown',value:null};
  }
  function zeroState(points,index) {
    return points.every(p=>Math.abs(p[index])<=EPS)?'yes':points.every(p=>p[index]>EPS)?'no':'unknown';
  }
  const det=q=>q[0]*q[3]-q[1]*q[2];
  function solve(entries,assumeIndependent=false) {
    const base=linearModel(entries);
    const model=base.error?base:assumeIndependent?independentModel(entries):base;
    if(model.error) return {ok:false,error:model.error,values:{},relations:{exclusive:'unknown',aSubsetB:'unknown',bSubsetA:'unknown',independent:'unknown'}};
    const values=Object.fromEntries(fields.map(f=>[f.id,identify(model,f)]));
    let independence='yes';
    if(!assumeIndependent) {
      // Testing vertices alone is insufficient: determinant is quadratic.
      const checks=model.points.slice();
      for(let i=0;i<model.points.length;i++) for(let j=i+1;j<model.points.length;j++) checks.push(model.points[i].map((v,k)=>(v+model.points[j][k])/2));
      if(!checks.every(q=>Math.abs(det(q))<=EPS)) independence=independentModel(entries).error?'no':'unknown';
    }
    return {ok:true,values,complete:fields.every(f=>values[f.id].status!=='unknown'),assumed:assumeIndependent,relations:{
      exclusive:zeroState(model.points,0),aSubsetB:zeroState(model.points,2),bSubsetA:zeroState(model.points,1),independent:independence
    }};
  }
  function conflicts(entries,assumeIndependent=false) {
    let subset={...entries};
    const feasible=e=>{const base=linearModel(e);return !base.error && (!assumeIndependent||!independentModel(e).error);};
    if(feasible(subset)) return [];
    for(const id of Object.keys(subset)) {const smaller={...subset};delete smaller[id];if(!feasible(smaller)) subset=smaller;}
    return Object.keys(subset);
  }
  return {fields,byId,parseInput,solve,conflicts};
})();
</script>
<script id="car-ui">
'use strict';
(() => {
  const $=id=>document.getElementById(id);
  const state={manual:{},assume:false,oneShot:false};
  const groups=[
    {color:'#55ffff',ids:['jAB','jAcB','jABc','jAcBc'],description:()=> '4 joints'},
    {color:'#55ff55',ids:['mA','mAc'],description:()=>`${E('a')} / ${E('ac')} totals`},
    {color:'#5555ff',ink:'#ffffff',ids:['mB','mBc'],description:()=>`${E('b')} / ${E('bc')} totals`},
    {color:'#ff55ff',ids:['cAgB','cAcgB'],description:()=>`${E('a')} / ${E('ac')} | ${E('b')}`},
    {color:'#ffffff',ids:['cAgBc','cAcgBc'],description:()=>`${E('a')} / ${E('ac')} | ${E('bc')}`},
    {color:'#ff5555',ids:['cBgA','cBcgA'],description:()=>`${E('b')} / ${E('bc')} | ${E('a')}`},
    {color:'#aaaaaa',ids:['cBgAc','cBcgAc'],description:()=>`${E('b')} / ${E('bc')} | ${E('ac')}`},
    {color:'#ffff55',ids:['total'],description:()=> 'P(S)'}
  ];
  const rows=[
    ['jAB','jAcB','mB','cAgB','cAcgB'],
    ['jABc','jAcBc','mBc','cAgBc','cAcgBc'],
    ['mA','mAc','total'],
    ['cBgA','cBgAc'],
    ['cBcgA','cBcgAc']
  ];
  const positions={}; rows.forEach((row,r)=>row.forEach((id,c)=>positions[id]=[r,c]));
  const escape=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const names=()=>({a:$('event-a').value.trim()||'T',b:$('event-b').value.trim()||'⊕'});
  const complement=key=>key.length===1?key+'c':key[0];
  function E(key) {
    const name=names()[key[0]],body=name==='⊕'?'<span class="detector-icon" aria-hidden="true"></span><span class="sr-only">detector positive</span>':escape(name);
    return `<span class="event-symbol">${body}${key.length>1?'<sup>c</sup>':''}</span>`;
  }
  const P=event=>`P(${event})`;
  const J=(a,b)=>P(`${E(a)}∩${E(b)}`);
  const K=(event,condition)=>P(`${E(event)}|${E(condition)}`);
  const M=event=>P(E(event));
  function jointKeys(field) {return [field.a?'ac':'a',field.b?'bc':'b'];}
  function formulaData(id) {
    if(id==='total') return {name:'P(S)',formulas:[`= ${M('a')} + ${M('ac')}`,`= ${M('b')} + ${M('bc')}`,'= 1']};
    const f=CarSolver.byId[id];
    if(f.kind==='joint') {
      const [a,b]=jointKeys(f);
      return {name:J(a,b),formulas:[`= ${K(a,b)}${M(b)}`,`= ${K(b,a)}${M(a)}`,`= ${M(b)} − ${J(complement(a),b)}`,`= ${M(a)} − ${J(a,complement(b))}`]};
    }
    if(f.kind==='marginal') {
      const e=f.event,joints=e[0]==='a'?[J(e,'b'),J(e,'bc')]:[J('a',e),J('ac',e)];
      return {name:M(e),formulas:[`= ${joints[0]} + ${joints[1]}`,`= 1 − ${M(complement(e))}`]};
    }
    const joint=CarSolver.fields[f.n.indexOf(1)],[a,b]=jointKeys(joint);
    return {name:K(f.event,f.condition),formulas:[`= ${J(a,b)} / ${M(f.condition)}`,`= 1 − ${K(complement(f.event),f.condition)}`]};
  }
  function plainEvent(key) {const name=names()[key[0]];return (key.length>1?'the complement of ':'')+(name==='⊕'?'detector positive':name);}
  function fieldLabel(f) {
    if(f.kind==='joint') {const [a,b]=jointKeys(f);return `Probability of ${plainEvent(a)} and ${plainEvent(b)}`;}
    if(f.kind==='marginal') return `Probability of ${plainEvent(f.event)}`;
    return `${f.metric?f.metric.toLowerCase()+': ':''}Probability of ${plainEvent(f.event)} given ${plainEvent(f.condition)}`;
  }
  function frameStyle(id,group) {
    const [r,c]=positions[id],coordinates=group.ids.map(key=>positions[key]);
    const top=r===Math.min(...coordinates.map(p=>p[0])),bottom=r===Math.max(...coordinates.map(p=>p[0]));
    const left=c===Math.min(...coordinates.map(p=>p[1])),right=c===Math.max(...coordinates.map(p=>p[1]));
    return `top:${top?5:-1}px;bottom:${bottom?5:-1}px;left:${left?5:-1}px;right:${right?5:-1}px;border-width:${top?2:0}px ${right?2:0}px ${bottom?2:0}px ${left?2:0}px`;
  }
  function makeCell(id,col) {
    const group=groups.find(g=>g.ids.includes(id)),f=CarSolver.byId[id],kind=f?f.kind:'marginal';
    return `<td class="prob-cell ${kind}${col===2?' total-boundary':''}" data-cell="${id}" style="--group:${group.color};--ink:${group.ink||'#000000'}">
      <div class="cell-frame" style="${frameStyle(id,group)}" aria-hidden="true"></div>
      <div class="cell-content">${kind==='conditional'?`<div class="metric-label">${f.metric||'&nbsp;'}</div>`:''}
      <div class="prob-name" id="name-${id}"></div>
      <div class="value-line">${id==='total'?'<span class="fixed-total" aria-label="Probability of the whole space equals one">1</span><span class="cell-source">FIXED</span>':`<input class="prob-input" id="input-${id}" data-id="${id}" type="text" inputmode="text" autocomplete="off" spellcheck="false" maxlength="40" placeholder="—" aria-describedby="source-${id}"><span class="cell-source" id="source-${id}">—</span>`}</div>
      <div class="formula-list" id="formulas-${id}"></div></div></td>`;
  }
  function buildChart() {
    $('chart-head').innerHTML='<tr><th scope="col"><small>EVENTS</small>↓ / →</th><th scope="col" id="head-a"></th><th scope="col" id="head-ac"></th><th scope="col" class="total-boundary">TOTALS</th><th scope="col" id="head-ca"></th><th scope="col" id="head-cac"></th></tr>';
    const diagnostics=`<td class="diagnostics" colspan="2" rowspan="3"><div class="diagnostic-inner"><div class="unused-lines" aria-hidden="true">${Array(12).fill('~').join('\n')}</div><div class="assumption" id="assumption" hidden>INDEPENDENCE ASSUMED<span class="assumption-formula" id="assumption-formula"></span><button id="remove-assumption" type="button">Remove assumption</button></div></div></td>`;
    $('chart-body').innerHTML=rows.map((row,r)=>`<tr class="${r===2?'total-row':r===3?'below-total':''}"><th scope="row" id="row-head-${r}"></th>${row.map(makeCell).join('')}${r===2?diagnostics:r>=3?'<td class="void total-boundary"><span aria-hidden="true">~</span></td>':''}</tr>`).join('');
    for(const f of CarSolver.fields) {
      const input=$('input-'+f.id);
      input.addEventListener('focus',()=>{if(input.dataset.source==='solved') input.select();});
      input.addEventListener('input',()=>{
        if(input.value.trim()) state.manual[f.id]=input.value; else delete state.manual[f.id];
        state.oneShot=false;refresh(f.id);
      });
      input.addEventListener('blur',()=>refresh());
    }
    $('remove-assumption').addEventListener('click',()=>{state.assume=false;state.oneShot=false;refresh();});
    const signals=[['complete','COMPLETE','#55ff55'],['progress','IN PROGRESS','#ffff55'],['exclusive','MUTUALLY EXCLUSIVE','#55ffff'],['aSubsetB','','#ff55ff'],['bSubsetA','','#ffffff'],['independent','INDEPENDENT','#5555ff']];
    $('lights').innerHTML=signals.map(([id,title,color])=>`<div class="light" id="light-${id}" data-state="unknown" style="--signal:${color}"><div class="bulb" aria-hidden="true"></div><div class="light-label" id="light-label-${id}">${title}</div><span class="light-state" id="light-state-${id}">UNKNOWN</span></div>`).join('');
  }
  function renderNames() {
    $('head-a').innerHTML=`<small>REALITY</small><span class="head-event">${E('a')}</span>`;
    $('head-ac').innerHTML=E('ac');$('head-ca').innerHTML=P(`${E('a')}|__`);$('head-cac').innerHTML=P(`${E('ac')}|__`);
    $('row-head-0').innerHTML=`<small>DETECTOR</small>${E('b')}`;$('row-head-1').innerHTML=E('bc');$('row-head-2').textContent='TOTALS';
    $('row-head-3').innerHTML=P(`${E('b')}|__`);$('row-head-4').innerHTML=P(`${E('bc')}|__`);
    for(const id of [...CarSolver.fields.map(f=>f.id),'total']) {
      const data=formulaData(id);$('name-'+id).innerHTML=data.name;$('formulas-'+id).innerHTML=data.formulas.map(line=>`<div>${line}</div>`).join('');
      if(id!=='total') $('input-'+id).setAttribute('aria-label',fieldLabel(CarSolver.byId[id]));
    }
    $('light-label-aSubsetB').innerHTML=`${E('a')} IS SUBSET OF ${E('b')}`;
    $('light-label-bSubsetA').innerHTML=`${E('b')} IS SUBSET OF ${E('a')}`;
    $('group-legend').innerHTML=groups.map(g=>`<div class="legend-group"><i class="swatch" style="--group:${g.color}" aria-hidden="true"></i><span>${g.description()}</span></div>`).join('');
    $('assumption-formula').innerHTML=`${J('a','b')} = ${M('a')}${M('b')}`;
  }
  const format=value=>Number(value.toPrecision(10)).toString();
  const textMeasure=document.createElement('canvas').getContext('2d');
  function fitInput(input) {
    const css=getComputedStyle(input);
    textMeasure.font=`${css.fontWeight} 16px ${css.fontFamily}`;
    const width=textMeasure.measureText(input.value||'0').width;
    const available=input.clientWidth-parseFloat(css.paddingLeft)-parseFloat(css.paddingRight)-3;
    input.style.fontSize=Math.min(16,Math.max(10,Math.floor(16*available/Math.max(width,1))))+'px';
  }
  function setLight(id,value,note,title) {
    $('light-'+id).dataset.state=value;
    $('light-state-'+id).textContent=note||({yes:'YES',no:'NO',unknown:'?'}[value]);
    $('light-'+id).title=title||'';
  }
  function refresh(skipId=null) {
    const entries={},invalid=[];
    let inputError='';
    for(const [id,raw] of Object.entries(state.manual)) {
      const parsed=CarSolver.parseInput(raw);
      if(parsed.error) {invalid.push(id);inputError=parsed.error;}
      else if(!parsed.empty) entries[id]=parsed.value;
    }
    const result=invalid.length?{ok:false,error:'invalid',values:{},relations:{}}:CarSolver.solve(entries,state.assume);
    const conflictIds=invalid.length?invalid:result.ok?[]:CarSolver.conflicts(entries,state.assume);
    const showSolved=$('auto-fill').checked||state.oneShot;
    let solved=0,undefinedCount=0,open=0,warnings=0;
    for(const f of CarSolver.fields) {
      const input=$('input-'+f.id),badge=$('source-'+f.id),given=Object.hasOwn(state.manual,f.id),record=result.values[f.id];
      let value=given?state.manual[f.id]:'',source=given?'given':'unknown',badgeText=given?'GIVEN':'—',tip=fieldLabel(f);
      if(conflictIds.includes(f.id)) {source='error';badgeText='CHECK';}
      if(!given && showSolved && result.ok && record.status==='known') {
        value=format(record.value);source='solved';badgeText=record.mayBeUndefined?'SOLVED*':'SOLVED';solved++;
        tip+='; calculated from the givens'+(record.mayBeUndefined?', valid when its conditioning total is positive.':'.');
        if(record.mayBeUndefined) warnings++;
      } else if(!given && showSolved && result.ok && record.status==='undefined') {
        source='undefined';badgeText='N/A';undefinedCount++;tip+='; undefined because its conditioning total is zero.';
      } else if(!given) open++;
      if(skipId!==f.id) input.value=value;
      input.dataset.source=source;input.setAttribute('aria-invalid',String(conflictIds.includes(f.id)));input.title=tip;
      input.placeholder=source==='undefined'?'N/A':'—';badge.textContent=badgeText;badge.className='cell-source '+source;
      fitInput(input);
    }
    const givenCount=Object.keys(state.manual).length,complete=result.ok&&open===0;
    $('given-count').textContent=String(givenCount).padStart(2,'0');$('solved-count').textContent=String(solved+undefinedCount).padStart(2,'0');$('open-count').textContent=String(open).padStart(2,'0');
    $('assumption').hidden=!state.assume;
    let message;
    if(!result.ok) {
      message=result.error==='invalid'?inputError:result.error==='zero-condition'?'Conditioning total is zero.':result.error==='independence'?'Givens conflict with independence.':'Conflicting givens. Check marked cells.';
    } else if(complete) {
      message='Complete.'+(undefinedCount?` ${undefinedCount} N/A (zero denominator).`:'');
    } else if(!givenCount) {
      message='Ready.';
    } else if(!showSolved) {
      message='Auto fill off.';
    } else {
      message=`${open} open.`+(warnings?' * Requires positive denominator.':'');
    }
    if(state.assume&&result.ok) message+=' Independence assumed.';
    if(result.ok&&names().a===names().b) message+=' Use different event names.';
    $('notice').textContent=message;$('notice').className='notice'+(result.ok?'':' error');
    setLight('complete',complete?'yes':'no');
    setLight('progress',givenCount&&!complete?'yes':'no',givenCount&&!complete&&!result.ok?'CHECK':null);
    const relations=result.ok?result.relations:{};
    setLight('exclusive',relations.exclusive||'unknown',null,`${plainEvent('a')} and ${plainEvent('b')} have joint probability zero.`);
    setLight('aSubsetB',relations.aSubsetB||'unknown',null,`${plainEvent('a')} and ${plainEvent('bc')} have joint probability zero.`);
    setLight('bSubsetA',relations.bSubsetA||'unknown',null,`${plainEvent('ac')} and ${plainEvent('b')} have joint probability zero.`);
    setLight('independent',relations.independent||'unknown',result.ok&&state.assume?'ASSUMED':null,'The joint probability equals the product of the marginals.');
  }
  buildChart();renderNames();refresh();
  document.fonts.ready.then(()=>CarSolver.fields.forEach(f=>fitInput($('input-'+f.id))));
  for(const id of ['event-a','event-b']) $(id).addEventListener('input',()=>{renderNames();refresh();});
  $('auto-fill').addEventListener('change',()=>{state.oneShot=false;refresh();});
  $('solve-available').addEventListener('click',()=>{state.oneShot=true;refresh();});
  $('solve-independent').addEventListener('click',()=>{state.assume=true;state.oneShot=true;refresh();});
  $('clear-all').addEventListener('click',()=>{state.manual={};state.assume=false;state.oneShot=false;$('event-a').value='T';$('event-b').value='⊕';$('auto-fill').checked=true;renderNames();refresh();});
  window.addEventListener('resize',()=>requestAnimationFrame(()=>CarSolver.fields.forEach(f=>fitInput($('input-'+f.id)))));
})();
</script>
</body>
</html>
